version: 2
# Grouped so that a week's updates arrive as one PR per ecosystem (D-055): one uv.lock change to
# review, one PROVENANCE.md sync (`uv run python scripts/sync_provenance.py`), and no chain of
# "update branch" merges between single-package PRs. Major versions still come one PR each,
# since they can change behaviour or licence (anthropic 2.x did both).
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
