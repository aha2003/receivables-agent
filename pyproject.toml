[project]
name = "receivables"
version = "0.1.0"
description = "Receivables collections agent prototype (synthetic data only)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.14.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
receivables = "receivables.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.169.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts; synthetic test credentials
# Verbatim SPEC §5 DDL; long lines are kept so the copy stays exact.
"src/receivables/adapters/db/migrations/versions/**" = ["E501"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["receivables.core", "receivables.agent"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
